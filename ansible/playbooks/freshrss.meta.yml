required_keys:
  - freshrss_subdomain
subdomain: freshrss
version:
  value: "1.30.2"
  datasource: github-releases
  depName: "FreshRSS/FreshRSS"
backup:
  systemd_services: [freshrss-update.timer]
  paths: [/var/lib/freshrss, /opt/freshrss/data]
  owner: [freshrss, freshrss]
  restore_advice: "database paths should be fine, but verify feeds update"
units: [freshrss-update, freshrss-update.timer]

required_keys: [headscale_subdomain]
subdomain: hs
memory:
  headscale: { high: 160M, max: 256M }
version:
  value: "0.29.7"
  datasource: github-releases
  depName: "juanfont/headscale"
  extractVersion: "^v(?<version>.+)$"
backup:
  systemd_services: [headscale]
  paths: [/var/lib/headscale]
  owner: [headscale, headscale]
units: [headscale]

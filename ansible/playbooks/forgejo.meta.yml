required_keys:
  - cloudflare_dns_api_token
  - domain
  - forgejo_admin_password
  - forgejo_admin_user
  - forgejo_subdomain
subdomain: git
memory:
  forgejo: { high: 400M, max: 600M }
version:
  value: "16.0.5"
  datasource: forgejo-releases
  depName: "forgejo/forgejo"
  extractVersion: "^v(?<version>.+)$"
backup:
  systemd_services: [forgejo]
  paths: [/etc/forgejo, /var/lib/forgejo]
  owner: [forgejo, forgejo]
  restore_advice: "the three signing secrets live in /etc/forgejo; without them every session, 2FA enrolment and OAuth token is void"
units: [forgejo]

- name: SSH Daemon Configuration
  block:
    - name: Install OpenSSH server
      ansible.builtin.apt:
        name: openssh-server
        state: present

    - name: Create sshusers group for SSH access control
      ansible.builtin.group:
        name: sshusers
        state: present

    - name: Add user to sshusers group
      ansible.builtin.user:
        name: "{{ user_name }}"
        groups: sshusers
        append: true

    - name: Add root to sshusers group
      ansible.builtin.user:
        name: root
        groups: sshusers
        append: true

    - name: Create SSH login banner
      ansible.builtin.copy:
        content: "{{ ssh_banner_content }}"
        dest: /etc/issue.net
        mode: "0644"

    - name: Add new user's SSH public key
      ansible.posix.authorized_key:
        user: "{{ user_name }}"
        state: present
        key: "{{ lookup('file', ssh_public_key_path) }}"

    - name: Use custom sshd_config
      ansible.builtin.template:
        src: templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        mode: "0600"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    - name: Read effective sshd config
      ansible.builtin.command:
        cmd: /usr/sbin/sshd -T
      register: ssh_effective_config
      changed_when: false
      when: not ansible_check_mode

    - name: Assert drop-ins did not weaken sshd auth
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in ssh_effective_config.stdout_lines"
          - "'kbdinteractiveauthentication no' in ssh_effective_config.stdout_lines"
          - "'permitemptypasswords no' in ssh_effective_config.stdout_lines"
          - "'permitrootlogin no' in ssh_effective_config.stdout_lines"
          - "'pubkeyauthentication yes' in ssh_effective_config.stdout_lines"
        fail_msg: "sshd -T reports weakened auth; check /etc/ssh/sshd_config.d"
      when: not ansible_check_mode

    - name: Find Match blocks in sshd drop-ins
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
        contains: '(?i)^\s*match\s'
      register: ssh_match_drop_ins

    - name: Refuse Match blocks in sshd drop-ins
      ansible.builtin.assert:
        that:
          - ssh_match_drop_ins.matched == 0
        fail_msg: >-
          sshd -T cannot see Match-scoped overrides, so drop-ins must not open Match blocks:
          {{ ssh_match_drop_ins.files | map(attribute='path') | join(', ') }}

    - name: Output configured SSH port
      ansible.builtin.debug:
        msg: "SSH port configured: {{ ssh_port }}"

- name: Validate SSH connection before closing ports
  ansible.builtin.include_tasks: validate.yml

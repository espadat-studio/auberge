---
memsearch_user: "{{ admin_user_name | default(ansible_user | default(ansible_ssh_user)) }}"
memsearch_home: "/home/{{ memsearch_user }}"
memsearch_store_group: "{{ memsearch_user }}"
memsearch_store_mode: "0750"

memsearch_store_dir: /srv/agent-memory/.memsearch
memsearch_memory_dir: "{{ memsearch_store_dir }}/memory"

memsearch_state_dir: "{{ memsearch_home }}/.memsearch"
memsearch_index_uri: "{{ memsearch_state_dir }}/milvus.db"
memsearch_collection: agent_memory

memsearch_embedding_model: gpahal/bge-m3-onnx-int8

memsearch_install_dir: /opt/memsearch
memsearch_bin_dir: "{{ memsearch_install_dir }}/bin"
memsearch_bin: "{{ memsearch_bin_dir }}/memsearch"
memsearch_uv_bin: "{{ memsearch_bin_dir }}/uv"
memsearch_path_link: /usr/local/bin/memsearch

# renovate: datasource=github-releases depName=astral-sh/uv
memsearch_uv_version: "0.13.6"
memsearch_uv_url: "https://github.com/astral-sh/uv/releases/download/{{ memsearch_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
memsearch_uv_sha256: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"

memsearch_uv_environment:
  UV_TOOL_DIR: "{{ memsearch_install_dir }}/tools"
  UV_TOOL_BIN_DIR: "{{ memsearch_bin_dir }}"
  UV_PYTHON_INSTALL_DIR: "{{ memsearch_install_dir }}/python"
  UV_CACHE_DIR: "{{ memsearch_install_dir }}/cache"
  UV_COMPILE_BYTECODE: "1"
  UV_NO_BUILD: "1"

memsearch_legacy_paths:
  - .local/bin/memsearch
  - .local/bin/uv
  - .local/bin/uvx
  - .local/share/uv/tools/memsearch

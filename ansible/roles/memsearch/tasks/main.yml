---
- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
    state: present

# Everything memsearch executes is root's: any user runs it through
# /usr/local/bin, so a copy its user could rewrite would run that user's code
# under whoever calls it. The user keeps only its config, index and model cache.
- name: Create the memsearch install directory
  ansible.builtin.file:
    path: "{{ memsearch_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read installed uv version
  ansible.builtin.command: "{{ memsearch_uv_bin }} --version"
  register: memsearch_uv_check
  changed_when: false
  failed_when: false

- name: Set installed uv version fact
  ansible.builtin.set_fact:
    memsearch_uv_installed_version: >-
      {{ memsearch_uv_check.stdout | default('')
         | regex_search('(?<=uv )\S+')
         | default('', true) }}

- name: Install the pinned uv release
  when: memsearch_uv_installed_version != memsearch_uv_version
  block:
    - name: Create a private staging directory for uv
      ansible.builtin.tempfile:
        state: directory
        suffix: _uv
      register: memsearch_uv_tmpdir

    - name: Download the uv release
      ansible.builtin.get_url:
        url: "{{ memsearch_uv_url }}"
        dest: "{{ memsearch_uv_tmpdir.path }}/uv.tar.gz"
        checksum: "sha256:{{ memsearch_uv_sha256 }}"
        mode: "0600"

    - name: Unpack uv
      ansible.builtin.unarchive:
        src: "{{ memsearch_uv_tmpdir.path }}/uv.tar.gz"
        dest: "{{ memsearch_bin_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1]
        owner: root
        group: root
        mode: "0755"
  always:
    - name: Remove the uv staging directory
      ansible.builtin.file:
        path: "{{ memsearch_uv_tmpdir.path }}"
        state: absent
      when: memsearch_uv_tmpdir.path is defined

# The store root is created in its own right, not left to the implicit parent
# `state: directory` would make: an implicit parent lands root-owned, and
# memsearch writes `.index-state.json` beside `memory/`, as the store's user.
# That write is suppressed on OSError, so a root-owned root costs the
# diagnostics silently -- and costs a by-hand `memsearch index` outright.
- name: Create the box-global store root
  ansible.builtin.file:
    path: "{{ memsearch_store_dir }}"
    state: directory
    follow: false
    owner: "{{ memsearch_user }}"
    group: "{{ memsearch_store_group }}"
    mode: "{{ memsearch_store_mode }}"

- name: Create the box-global memory directory
  ansible.builtin.file:
    path: "{{ memsearch_memory_dir }}"
    state: directory
    follow: false
    owner: "{{ memsearch_user }}"
    group: "{{ memsearch_store_group }}"
    mode: "{{ memsearch_store_mode }}"

- name: Create the memsearch state directory
  become: true
  become_user: "{{ memsearch_user }}"
  ansible.builtin.file:
    path: "{{ memsearch_state_dir }}"
    state: directory
    follow: false
    mode: "0750"

- name: Read installed memsearch version
  ansible.builtin.command: "{{ memsearch_bin }} --version"
  register: memsearch_check
  changed_when: false
  failed_when: false

- name: Set installed memsearch version fact
  ansible.builtin.set_fact:
    memsearch_installed_version: >-
      {{ memsearch_check.stdout | default('')
         | regex_search('(?<=version )\S+')
         | default('', true) }}

- name: Install memsearch with the local ONNX embedder
  ansible.builtin.command: >
    {{ memsearch_uv_bin }} tool install --force
    memsearch[onnx]=={{ memsearch_version }}
  when: memsearch_installed_version != memsearch_version
  changed_when: true
  environment: "{{ memsearch_uv_environment }}"

# The per-user install this replaces sits earlier on the user's PATH and would
# shadow every later version bump.
- name: Remove the per-user memsearch install
  become: true
  become_user: "{{ memsearch_user }}"
  ansible.builtin.file:
    path: "{{ memsearch_home }}/{{ item }}"
    state: absent
  loop: "{{ memsearch_legacy_paths }}"

- name: Put memsearch on every PATH
  ansible.builtin.file:
    src: "{{ memsearch_bin }}"
    dest: "{{ memsearch_path_link }}"
    state: link

- name: Pin the store, the index and the embedder
  become: true
  become_user: "{{ memsearch_user }}"
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ memsearch_state_dir }}/config.toml"
    mode: "0640"

- name: Index the store, downloading the ONNX model on a fresh box
  become: true
  become_user: "{{ memsearch_user }}"
  ansible.builtin.command: "{{ memsearch_bin }} index {{ memsearch_memory_dir }}"
  changed_when: false
  environment:
    HOME: "{{ memsearch_home }}"

---
# renovate: datasource=github-releases depName=astral-sh/uv
hermes_uv_version: "0.13.4"
hermes_uv_url: "https://github.com/astral-sh/uv/releases/download/{{ hermes_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
hermes_uv_sha256: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
hermes_user: hermes
hermes_group: hermes
hermes_home: "/home/{{ hermes_user }}"
hermes_config_dir: "{{ hermes_home }}/.hermes"
hermes_install_dir: "{{ hermes_config_dir }}/hermes-agent"
hermes_venv_dir: "{{ hermes_config_dir }}/venv"

hermes_config_src: "~/.config/hermes/config.yaml"
hermes_extras: "all"

hermes_provider_env_vars:
  anthropic: ANTHROPIC_API_KEY
  deepseek: DEEPSEEK_API_KEY
  gemini: GOOGLE_API_KEY
  kimi: KIMI_API_KEY
  openrouter: OPENROUTER_API_KEY
  xai: XAI_API_KEY
  zai: GLM_API_KEY

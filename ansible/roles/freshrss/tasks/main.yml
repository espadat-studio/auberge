- name: Install and configure FreshRSS
  block:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - php
          - php-cli
          - php-fpm
          - php-curl
          - php-gmp
          - php-intl
          - php-mbstring
          - php-sqlite3
          - php-xml
          - php-zip
          - git
        state: present
        update_cache: true

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Detect installed PHP-FPM version
      ansible.builtin.set_fact:
        freshrss_php_fpm_version: "{{ item.key | regex_replace('^php(\\d+\\.\\d+)-fpm$', '\\1') }}"
      loop: "{{ ansible_facts.packages | dict2items }}"
      when: item.key is match('^php\\d+\\.\\d+-fpm$')

    - name: Create system group for FreshRSS
      ansible.builtin.group:
        name: "{{ freshrss_sys_group }}"
        state: present

    - name: Create system user for FreshRSS
      ansible.builtin.user:
        name: "{{ freshrss_sys_user }}"
        group: "{{ freshrss_sys_group }}"
        shell: /usr/sbin/nologin
        home: "{{ freshrss_install_path }}"
        create_home: false
        system: true
        state: present

    - name: Create FreshRSS installation directory
      ansible.builtin.file:
        path: "{{ freshrss_install_path }}"
        state: directory
        owner: "{{ freshrss_sys_user }}"
        group: "{{ freshrss_sys_group }}"
        mode: "0755"

    - name: Create FreshRSS data directory
      ansible.builtin.file:
        path: "{{ freshrss_data_dir }}"
        state: directory
        owner: "{{ freshrss_sys_user }}"
        group: "{{ freshrss_sys_group }}"
        mode: "0700"

    - name: Check if FreshRSS is already cloned
      ansible.builtin.stat:
        path: "{{ freshrss_install_path }}/.git"
      register: freshrss_git_check

    - name: Clone FreshRSS repository
      when: not freshrss_git_check.stat.exists
      become: true
      become_user: "{{ freshrss_sys_user }}"
      ansible.builtin.git:
        repo: https://github.com/FreshRSS/FreshRSS.git
        dest: "{{ freshrss_install_path }}"
        version: "{{ freshrss_version }}"
        depth: 1
      notify: Restart freshrss php-fpm

    - name: Check for local modifications in FreshRSS directory # noqa: command-instead-of-module
      when: freshrss_git_check.stat.exists
      become: true
      become_user: "{{ freshrss_sys_user }}"
      ansible.builtin.command: git status --porcelain
      args:
        chdir: "{{ freshrss_install_path }}"
      register: freshrss_git_status
      changed_when: false

    - name: Set ownership for FreshRSS data directory
      ansible.builtin.file:
        path: "{{ freshrss_install_path }}/data"
        state: directory
        owner: "{{ freshrss_sys_user }}"
        group: "{{ freshrss_sys_group }}"
        mode: "0700"
        recurse: true

    - name: Update FreshRSS repository
      when:
        - freshrss_git_check.stat.exists
        - freshrss_git_status.stdout == ""
      become: true
      become_user: "{{ freshrss_sys_user }}"
      ansible.builtin.git:
        repo: https://github.com/FreshRSS/FreshRSS.git
        dest: "{{ freshrss_install_path }}"
        version: "{{ freshrss_version }}"
        update: true
      register: freshrss_update
      changed_when: freshrss_update.before != freshrss_update.after
      notify: Restart freshrss php-fpm

    - name: Link data directory to persistent location
      ansible.builtin.file:
        src: "{{ freshrss_data_dir }}"
        dest: "{{ freshrss_install_path }}/data/user_data"
        state: link
        owner: "{{ freshrss_sys_user }}"
        group: "{{ freshrss_sys_group }}"
        force: true

    - name: Stop and disable the retired FreshRSS php -S service
      ansible.builtin.systemd_service:
        name: freshrss
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the retired FreshRSS php -S unit file
      ansible.builtin.file:
        path: /etc/systemd/system/freshrss.service
        state: absent

    - name: Reload systemd after removing the retired unit
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Clear the failed state the retired FreshRSS unit may latch
      ansible.builtin.command: systemctl reset-failed freshrss.service
      register: freshrss_retired_reset
      changed_when: freshrss_retired_reset.rc == 0
      failed_when: false

    - name: Deploy FreshRSS PHP-FPM pool configuration
      ansible.builtin.template:
        src: templates/freshrss-fpm.conf.j2
        dest: /etc/php/{{ freshrss_php_fpm_version }}/fpm/pool.d/freshrss.conf
        owner: root
        group: root
        mode: "0644"
      register: freshrss_fpm_pool

    - name: Check for the FreshRSS PHP-FPM socket
      ansible.builtin.stat:
        path: "{{ freshrss_fpm_socket }}"
      register: freshrss_fpm_socket_probe

    - name: Restart PHP-FPM to load the FreshRSS pool
      when: >-
        freshrss_fpm_pool is changed
        or not (freshrss_fpm_socket_probe.stat.issock | default(false))
      ansible.builtin.systemd_service:
        name: php{{ freshrss_php_fpm_version }}-fpm
        state: restarted

    - name: Flush handlers so a pending php-fpm restart lands before the probe
      ansible.builtin.meta: flush_handlers

    - name: Wait for the FreshRSS PHP-FPM socket
      ansible.builtin.wait_for:
        path: "{{ freshrss_fpm_socket }}"
        timeout: 10

    - name: Deploy FreshRSS Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/sites/freshrss.caddyfile
        owner: root
        group: root
        mode: "0644"
      notify: Restart caddy

    - name: Remove the FQDN-named vhost freshrss.caddyfile replaces
      ansible.builtin.file:
        path: "/etc/caddy/sites/{{ freshrss_domain }}.caddyfile"
        state: absent
      notify: Restart caddy

    - name: Deploy systemd timer for feed updates
      ansible.builtin.template:
        src: templates/freshrss-update.timer.j2
        dest: /etc/systemd/system/freshrss-update.timer
        owner: root
        group: root
        mode: "0644"
      notify: Restart freshrss-update

    - name: Deploy systemd service for feed updates
      ansible.builtin.template:
        src: templates/freshrss-update.service.j2
        dest: /etc/systemd/system/freshrss-update.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart freshrss-update

    - name: Enable and start systemd timer for feed updates
      ansible.builtin.systemd_service:
        name: freshrss-update.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Ensure Cloudflare DNS A record exists for {{ freshrss_domain }}
      ansible.builtin.include_role:
        name: dns_record
      vars:
        dns_record_subdomain: "{{ freshrss_subdomain }}"
        dns_record_domain: "{{ freshrss_parent_domain }}"
        dns_record_cloudflare_api_token: "{{ freshrss_dns_api_token }}"

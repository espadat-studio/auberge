- name: Restart freshrss php-fpm
  ansible.builtin.systemd_service:
    name: "php{{ freshrss_php_fpm_version }}-fpm"
    state: restarted

- name: Restart caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted

- name: Restart freshrss-update
  ansible.builtin.systemd_service:
    name: freshrss-update.timer
    state: restarted
    daemon_reload: true

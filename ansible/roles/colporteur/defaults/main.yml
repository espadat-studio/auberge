colporteur_install_path: /opt/colporteur
colporteur_binary_path: "{{ colporteur_install_path }}/colporteur"
colporteur_sys_user: colporteur
colporteur_sys_group: colporteur
colporteur_data_dir: /var/lib/colporteur
colporteur_feeds_dir: /var/lib/colporteur/feeds
colporteur_config_dir: /etc/colporteur
colporteur_domain: "{{ colporteur_subdomain }}.{{ colporteur_parent_domain }}"
colporteur_binary_url: "https://github.com/espadat-studio/colporteur/releases/download/v{{ colporteur_version }}/colporteur-x86_64-unknown-linux-gnu.tar.gz"
colporteur_binary_sha256: "543c1f2e845f26f2c8da38fc3f52b8458ca749bfa758cbfe2914ca8422ba827f"
colporteur_check_interval: 15min
colporteur_config_src: "~/.config/colporteur/config.toml"
colporteur_freshrss_sync: false
colporteur_freshrss_install_path: /opt/freshrss
colporteur_freshrss_user: freshrss
colporteur_internal_port: 8085

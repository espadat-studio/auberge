---
syncthing_user: "{{ admin_user_name | default(ansible_user | default(ansible_ssh_user)) }}"
syncthing_config_path: "/home/{{ syncthing_user }}/.local/state/syncthing"
syncthing_listen_all_interfaces: false
syncthing_discovery_enabled: ~

# The Host's peers, declared once: `name=ID,name=ID`. Folders name them.
syncthing_devices: ""

# Each folder: id, label, path, devices (comma-separated names from
# `syncthing_devices`), ignore_perms, versioning (a Syncthing versioning object,
# or ~ for none). A folder left out of the list is left alone, never removed.
syncthing_folders: >-
  {{ [syncthing_knowledge_vault_folder]
     if knowledge_vault_path | default('') | length > 0 else [] }}

# ignorePerms is load-bearing: without it Syncthing creates pulled files with
# the peer's mode and re-chmods them on every metadata update, which caps the
# ACL mask of an App's write grant at the group bits (ADR-0091). Versioning is staggered,
# 30 days, on this Host's copy only.
syncthing_knowledge_vault_folder:
  id: "{{ knowledge_vault_folder_id }}"
  label: "{{ knowledge_vault_folder_label | default('Knowledge Vault') }}"
  path: "{{ knowledge_vault_path }}"
  devices: "{{ knowledge_vault_devices }}"
  ignore_perms: true
  versioning:
    type: staggered
    params:
      maxAge: "2592000"

# Derived from what the API reports, not knobs: a deploy compares these against
# the running configuration and writes only when they differ, so a converged
# Host reports no change.
syncthing_api: "http://127.0.0.1:8384/rest"

syncthing_listen_address: "0.0.0.0:8384"

# 204 is a login with the declared credentials, 403 a different password, 404
# no GUI user at all.
syncthing_gui_auth_is_current: "{{ syncthing_gui_login.status == 204 }}"

syncthing_listen_is_current: >-
  {{ syncthing_running.json.gui.address == syncthing_listen_address }}

syncthing_discovery_is_current: >-
  {{ [syncthing_running.json.options.globalAnnounceEnabled,
      syncthing_running.json.options.localAnnounceEnabled,
      syncthing_running.json.options.relaysEnabled,
      syncthing_running.json.options.natEnabled]
     | unique | list == [syncthing_discovery_enabled | bool] }}

# Syncthing canonicalizes a device ID on parse -- uppercased, re-dashed, with
# 0/1 mapped to O/I -- so the text an operator pasted into config.toml is not
# necessarily the text `/rest/config` reports back. Comparing the two verbatim
# makes a PUT that worked look like one that never converged, and the write
# then reports `changed` on every deploy forever. Every comparison below runs
# on the dash-stripped, upper-cased form; every write sends the raw value and
# lets Syncthing canonicalize it.
syncthing_device_entries: "{{ syncthing_devices | split(',') | map('trim') | select | list }}"

syncthing_device_registry: >-
  {{ dict(syncthing_device_entries | map('regex_replace', '=.*$', '') | map('trim')
          | zip(syncthing_device_entries | map('regex_replace', '^[^=]*=', '') | map('trim'))) }}

syncthing_folder_device_names: "{{ item.devices | default('') | split(',') | map('trim') | select | list }}"

# Device loop: `item` is one registry entry, `key` its name, `value` its ID.
syncthing_device_key: "{{ item.value | replace('-', '') | upper }}"

syncthing_declared_device: >-
  {{ syncthing_running.json.devices | map(attribute='deviceID')
     | map('replace', '-', '') | map('upper') | list
     | zip(syncthing_running.json.devices)
     | selectattr('0', 'eq', syncthing_device_key)
     | map(attribute='1') | list | first | default({}) }}

syncthing_device_is_current: >-
  {{ syncthing_declared_device.name | default('') == item.key
     and syncthing_declared_device.addresses | default([]) == ['dynamic'] }}

# Folder loop: `item` is one entry of `syncthing_folders`. The local device is
# named explicitly rather than left to Syncthing's own normalisation, so the
# comparison below reads the same list it wrote.
syncthing_folder_device_ids: >-
  {{ [syncthing_status.json.myID]
     + syncthing_folder_device_names | map('extract', syncthing_device_registry) | list }}

syncthing_folder_device_keys: >-
  {{ syncthing_folder_device_ids | map('replace', '-', '') | map('upper') | list | sort }}

syncthing_folder_versioning: "{{ item.versioning | default(none) or {'type': '', 'params': {}} }}"

# Everything the folder write sends is compared before it is sent. A field in
# the body but not in the check is a field a human can change in the web UI and
# keep: `paused` above all, which stops replication while every later deploy
# reports the folder converged. `syncXattrs` stays off: when on, Syncthing
# strips local extended attributes the peer lacks, POSIX ACLs included.
syncthing_desired_folder:
  id: "{{ item.id }}"
  label: "{{ item.label }}"
  path: "{{ item.path }}"
  type: sendreceive
  paused: false
  fsWatcherEnabled: true
  fsWatcherDelayS: 10
  rescanIntervalS: 60
  ignorePerms: "{{ item.ignore_perms | default(false) | bool }}"
  syncXattrs: false
  versioning: "{{ syncthing_folder_versioning }}"
  devices: "{{ syncthing_folder_device_ids | map('community.general.dict_kv', 'deviceID') | list }}"

syncthing_declared_folder: >-
  {{ syncthing_running.json.folders
     | selectattr('id', 'eq', item.id)
     | list | first | default({}) }}

syncthing_declared_versioning_params: "{{ syncthing_declared_folder.versioning.params | default({}) }}"

syncthing_folder_is_current: >-
  {{ syncthing_declared_folder.path | default('') == item.path
     and syncthing_declared_folder.label | default('') == item.label
     and syncthing_declared_folder.type | default('') == 'sendreceive'
     and syncthing_declared_folder.paused | default(true) == false
     and syncthing_declared_folder.fsWatcherEnabled | default(false) == true
     and syncthing_declared_folder.fsWatcherDelayS | default(0) == 10
     and syncthing_declared_folder.rescanIntervalS | default(0) == 60
     and syncthing_declared_folder.ignorePerms | default(false) == (item.ignore_perms | default(false) | bool)
     and syncthing_declared_folder.syncXattrs | default(true) == false
     and syncthing_declared_folder.versioning.type | default('') == syncthing_folder_versioning.type
     and syncthing_declared_versioning_params | combine(syncthing_folder_versioning.params)
         == syncthing_declared_versioning_params
     and syncthing_declared_folder.devices | default([])
         | map(attribute='deviceID') | map('replace', '-', '') | map('upper')
         | list | sort == syncthing_folder_device_keys }}
syncthing_key_url: https://syncthing.net/release-key.gpg
syncthing_key_sha256: "c38853d2ccb890ae428e1fbf05d8c8fe0ba6f560bd050e161fb4e5324cdb4a9b"

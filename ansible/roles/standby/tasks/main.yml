---
- name: Refuse to run the Standby Runner as the admin or agent user
  ansible.builtin.assert:
    that:
      - standby_runner_user != admin_user_name
      - standby_runner_user != agent_user_name
    fail_msg: "standby_runner_user must be neither admin_user_name nor agent_user_name"

- name: Install the poller's and runner's dependencies
  ansible.builtin.apt:
    name: [curl, jq, libicu76, openssl]
    state: present
    update_cache: false

- name: Create the Standby Runner group
  ansible.builtin.group:
    name: "{{ standby_runner_group }}"
    system: true
    state: present

- name: Create the Standby Runner user
  ansible.builtin.user:
    name: "{{ standby_runner_user }}"
    group: "{{ standby_runner_group }}"
    comment: "Standby Runner"
    home: "{{ standby_runner_home }}"
    shell: /usr/sbin/nologin
    create_home: true
    system: true
    state: present

- name: Close the Standby Runner home to other users
  ansible.builtin.file:
    path: "{{ standby_runner_home }}"
    state: directory
    owner: "{{ standby_runner_user }}"
    group: "{{ standby_runner_group }}"
    mode: "0700"

- name: Stat the agent user's home
  ansible.builtin.stat:
    path: "/home/{{ agent_user_name }}"
  register: standby_runner_agent_home

- name: Refuse an agent home the Standby Runner could read
  ansible.builtin.assert:
    that:
      - not standby_runner_agent_home.stat.exists or not standby_runner_agent_home.stat.roth
    fail_msg: "/home/{{ agent_user_name }} is world-readable, so the Standby Runner could read it"

# Before the per-job reset the runner user owned the install and everything in
# it, binaries included. Nothing in that tree is kept: the reset reinstalls.
- name: Stat the runner install directory
  ansible.builtin.stat:
    path: "{{ standby_runner_install_dir }}"
  register: standby_runner_install

- name: Remove a runner install the runner user owns
  when: standby_runner_install.stat.exists and standby_runner_install.stat.pw_name != 'root'
  ansible.builtin.file:
    path: "{{ standby_runner_install_dir }}"
    state: absent
  notify: Restart standby-runner

# Root-owned, so job code cannot write the release. The reset fills it (ADR-0085).
- name: Create the runner install directory
  ansible.builtin.file:
    path: "{{ standby_runner_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the root-only credentials directory
  ansible.builtin.file:
    path: "{{ standby_runner_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy the GitHub App private key
  ansible.builtin.copy:
    content: "{{ standby_runner_app_private_key | trim }}\n"
    dest: "{{ standby_runner_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Create the shared library directory
  ansible.builtin.file:
    path: "{{ standby_runner_lib_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the GitHub App library
  ansible.builtin.copy:
    src: standby-runner-lib.sh
    dest: "{{ standby_runner_lib_path }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart standby-runner
    - Restart standby-runner-flip timer

- name: Deploy the reset script
  ansible.builtin.copy:
    src: standby-runner-reset.sh
    dest: "{{ standby_runner_reset_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart standby-runner

- name: Deploy the registration script
  ansible.builtin.copy:
    src: standby-runner-register.sh
    dest: "{{ standby_runner_register_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart standby-runner

- name: Deploy the Runner Flip script
  ansible.builtin.copy:
    src: standby-runner-flip.sh
    dest: "{{ standby_runner_flip_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart standby-runner-flip timer

- name: Create the Runner Flip state directory
  ansible.builtin.file:
    path: "{{ standby_runner_flip_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy the Standby Runner unit
  ansible.builtin.template:
    src: standby-runner.service.j2
    dest: /etc/systemd/system/standby-runner.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart standby-runner

- name: Deploy the Runner Flip units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - standby-runner-flip.service
    - standby-runner-flip.timer
  notify: Restart standby-runner-flip timer

# The per-job reset leaves the weekly prune nothing to prune.
- name: Stop and disable the retired prune units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - standby-runner-prune.timer
    - standby-runner-prune.service
  failed_when: false

- name: Remove the retired prune units and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/standby-runner-prune.timer
    - /etc/systemd/system/standby-runner-prune.service
    - /usr/local/bin/standby-runner-prune

- name: Reload systemd after removing the retired units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Clear the failed state the retired prune units may latch
  ansible.builtin.command: "systemctl reset-failed {{ item }}"
  loop:
    - standby-runner-prune.timer
    - standby-runner-prune.service
  register: standby_runner_prune_reset
  changed_when: standby_runner_prune_reset.rc == 0
  failed_when: false

- name: Enable and start the Standby Runner
  ansible.builtin.systemd_service:
    name: standby-runner
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start the timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - standby-runner-flip.timer

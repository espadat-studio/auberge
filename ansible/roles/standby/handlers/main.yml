---
- name: Restart standby-runner
  ansible.builtin.systemd_service:
    name: standby-runner
    state: restarted
    daemon_reload: true

- name: Restart standby-runner-flip timer
  ansible.builtin.systemd_service:
    name: standby-runner-flip.timer
    state: restarted
    daemon_reload: true

- name: Restart standby-runner-prune timer
  ansible.builtin.systemd_service:
    name: standby-runner-prune.timer
    state: restarted
    daemon_reload: true

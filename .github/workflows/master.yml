name: master
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      any_rs_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: changed-files
        with:
          files: |
            .github/workflows/master.yml
            src/**/*.rs
            tests/**
            Cargo.toml
            Cargo.lock
            mise.toml
            ansible/**
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rm -fr .mise/config.toml
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          mise_toml: |
            [tasks]
            "check-format" = { run = "dprint check --excludes mise.toml" }
            "check-lint" = { run = "ansible-lint", dir = "ansible" }
            "check-shell" = { run = ["shellcheck $(git ls-files '*.sh')", "shfmt -d --apply-ignore $(git ls-files '*.sh')"] }
            "check" = { depends = "check-*" }
            [tools]
            dprint = "latest"
            pipx = "latest"
            "pipx:ansible-core" = "latest"
            "pipx:ansible-lint" = "latest"
            shellcheck = "latest"
            shfmt = "latest"
            uv = "latest"
      - run: mise settings experimental=true

      # --no-cache: a failed metadata call still writes a results-less entry to
      # ~/.ansible/galaxy_cache with a 24h expiry, and each later attempt reads
      # it back and dies on the same missing 'results' key, so the retries were
      # never independent. The backoff widens because galaxy's artifact CDN
      # returns 502 in bursts that outlast a flat 10s gap.
      - name: Install Ansible collections with retry
        working-directory: ansible
        shell: bash
        run: |
          attempts=3
          for attempt in $(seq $attempts); do
            if ansible-galaxy collection install --no-cache -r requirements.yml; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              delay=$((attempt * 20))
              echo "Attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "Failed after $attempts attempts"
          exit 1

      - run: mise r check

      - name: stdout discipline — print!/println! only in data-emitting modules
        shell: bash
        run: ./.github/scripts/check-stdout-discipline.sh

      - name: ADR numbering — one number per file, all indexed
        shell: bash
        run: ./.github/scripts/check-adr-numbering.sh

      # In `check` rather than in `_test`: that job is gated on Rust and ansible
      # changes, and these cover the reference scripts under examples/ as well
      # as the bichon and immich roles' scripts.
      - name: Shell unit tests
        shell: bash
        run: |
          ./tests/bichon-archive.test.sh
          ./tests/bichon-expunge.test.sh
          ./tests/bichon-uidvalidity-watch.test.sh
          ./tests/forgejo-onboard.test.sh
          ./tests/immich-b2-prune.test.sh
          ./tests/immich-backup.test.sh

      # Ungated like the shell tests, for a different reason: the suites live
      # under ansible/, so `_test`'s gate would cover them, but that job is the
      # Rust one. The ~16s (cold package cache plus uv's managed 3.13 download,
      # uncached by choice — ADR-0039) lands on a job that is not the critical
      # path: ~50s against `_test`'s ~2min.
      #
      # Byte-identical to mise.toml's `test-python`, asserted by
      # tests/test_pipeline.rs: mise-action overwrites mise.toml in the
      # workspace, so the task is unreachable and the command has to repeat.
      # `mise.toml` is in the changed-files gate above so that assertion runs on
      # the PR that would break it.
      #
      # PYTHONDONTWRITEBYTECODE, because ansible/ is what `include_dir!` embeds:
      # a __pycache__ beside the suites ships .pyc into the binary and moves the
      # assets fingerprint (ADR-0034), and `test-*` fans out concurrently, so a
      # .pyc written mid-embed is a flaky build failure.
      - name: Python unit tests
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 uv run --python 3.13 --with pytest --with icalendar --with recurring-ical-events --with caldav pytest ansible/roles/baikal/files

  _test:
    needs: changed-files
    if: needs.changed-files.outputs.any_rs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - run: cargo nextest run

  test:
    needs: _test
    # workaround for https://github.com/orgs/community/discussions/13690
    # https://stackoverflow.com/a/77066140/9771158
    if: ${{ !(failure() || cancelled()) }}
    runs-on: ubuntu-latest
    steps:
      - name: Tests OK (passed or skipped)
        run: exit 0

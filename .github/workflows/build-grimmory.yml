name: build-grimmory

on:
  workflow_dispatch:
    inputs:
      version:
        description: Grimmory version (without v prefix, e.g. 2.3.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - run: curl -fsSL "https://github.com/grimmory-tools/grimmory/archive/refs/tags/v${{ inputs.version }}.tar.gz" | tar -xz

      - run: npm ci --no-audit --no-fund
        working-directory: grimmory-${{ inputs.version }}/booklore-ui

      - run: npm run build -- --configuration=production
        working-directory: grimmory-${{ inputs.version }}/booklore-ui

      - name: Build the jar with the frontend dist bundled
        run: |
          DIST=$(dirname "$(find "$PWD/booklore-ui/dist" -name index.html -print -quit)")
          test -d "$DIST"
          cd booklore-api && ./gradlew clean build -x test --no-daemon -PfrontendDistDir="$DIST"
        working-directory: grimmory-${{ inputs.version }}

      - run: |
          JAR=$(find grimmory-${{ inputs.version }}/booklore-api/build/libs/ -name '*.jar' ! -name '*-plain.jar')
          cp "$JAR" grimmory-api.jar

      - name: Assert api icons and frontend are inside the jar
        run: |
          unzip -l grimmory-api.jar | grep -q 'static/images/icons/svg/'
          unzip -l grimmory-api.jar | grep -q 'static/index.html'

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: grimmory/v${{ inputs.version }}
          files: grimmory-api.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
